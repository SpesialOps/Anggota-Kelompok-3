<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile Kelompok 3 - X TKJ 3</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 60px 20px 40px;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
            color: #cbd5e1;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .about {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .about h2 {
            margin-bottom: 15px;
        }

        .about p {
            color: #dbeafe;
            line-height: 1.7;
        }

        .members-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .members {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            color: #0f172a;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            transition: 0.3s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .avatar {
            width: 80px;
            height: 80px;
            margin: auto;
            margin-bottom: 15px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
        }

        .card h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .card p {
            color: #64748b;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            margin-top: 30px;
            color: #cbd5e1;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
        }
